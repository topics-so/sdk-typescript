name: Release

# A `v*` tag publishes that version to npm through trusted publishing, so no
# npm token is stored here, and every release carries a provenance attestation
# linking it to the commit it was built from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${version}." && exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@topics-so/sdk@${version}" version >/dev/null 2>&1; then
            echo "@topics-so/sdk@${version} is already on npm."
          else
            npm publish --provenance --access public
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          awk -v v="## ${version}" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
